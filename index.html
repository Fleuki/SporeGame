<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spore Survivor (упрощённая)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background: #111;
      border: 2px solid #333;
      cursor: none;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #0f0;
      font: 18px monospace;
      pointer-events: none;
      text-shadow: 0 0 10px #0f0;
    }
    #ui span {
      color: #ff0;
    }
  </style>
</head>
<body>

<div id="ui">
  🧬 XP: <span id="xpDisplay">0</span> &nbsp;|&nbsp; 🧫 Уровень: <span id="levelDisplay">1</span> &nbsp;|&nbsp; 💀 Врагов: <span id="enemyCount">0</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>
  // ========== НАСТРОЙКИ ==========
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const W = 800;
  const H = 600;
  canvas.width = W;
  canvas.height = H;

  // Элементы UI
  const xpSpan = document.getElementById('xpDisplay');
  const levelSpan = document.getElementById('levelDisplay');
  const enemySpan = document.getElementById('enemyCount');

  // ========== ИГРОК ==========
  const player = {
    x: W / 2,
    y: H / 2,
    radius: 14,
    speed: 3.2,
    hp: 100,
    maxHp: 100,
    xp: 0,
    level: 1,
    xpToNext: 10,
    damage: 8,
    attackCooldown: 0,
    attackRate: 12, // кадров между выстрелами
    angle: 0,
  };

  // ========== МАССИВЫ ==========
  let enemies = [];
  let bullets = [];
  let particles = []; // только для эффекта смерти (мало)

  // ========== ВОЛНЫ ==========
  let wave = 1;
  let enemiesPerWave = 4;
  let spawnTimer = 0;
  let spawnInterval = 40; // кадров между спавнами
  let enemiesSpawned = 0;
  let waveDelay = 0;
  let gameOver = false;

  // ========== УПРАВЛЕНИЕ ==========
  const keys = { w: false, a: false, s: false, d: false };
  let mouseX = player.x;
  let mouseY = player.y;

  // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
  function dist(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
  }

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  // ========== СПАВН ВРАГА ==========
  function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const pad = 30;
    if (side === 0) { x = rand(-pad, W + pad); y = -pad; }
    else if (side === 1) { x = W + pad; y = rand(-pad, H + pad); }
    else if (side === 2) { x = rand(-pad, W + pad); y = H + pad; }
    else { x = -pad; y = rand(-pad, H + pad); }

    const hp = 20 + player.level * 4;
    const speed = 0.8 + player.level * 0.12;
    const size = 12 + Math.floor(player.level / 3);

    enemies.push({
      x,
      y,
      radius: size,
      hp: hp,
      maxHp: hp,
      speed: Math.min(speed, 2.8),
      damage: 10 + player.level * 2,
      xpReward: 5 + player.level * 2,
    });
  }

  // ========== ВЫСТРЕЛ ==========
  function shoot() {
    const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
    const speed = 6;
    bullets.push({
      x: player.x + Math.cos(angle) * (player.radius + 4),
      y: player.y + Math.sin(angle) * (player.radius + 4),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 5,
      damage: player.damage,
      life: 120, // кадров до исчезновения
    });
  }

  // ========== ЧАСТИЦЫ (смерть врага) ==========
  function emitParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(1, 4);
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: rand(2, 5),
        life: 30 + rand(0, 20),
        color,
      });
    }
  }

  // ========== НАЧАЛО НОВОЙ ВОЛНЫ ==========
  function startWave() {
    wave++;
    enemiesPerWave = Math.floor(4 + wave * 1.8);
    spawnInterval = Math.max(12, 40 - wave * 1.5);
    enemiesSpawned = 0;
    waveDelay = 30; // пауза перед волной
  }

  // ========== ОБНОВЛЕНИЕ ==========
  function update() {
    if (gameOver) return;

    // ---- Игрок ----
    let dx = 0,
      dy = 0;
    if (keys.w) dy = -1;
    if (keys.s) dy = 1;
    if (keys.a) dx = -1;
    if (keys.d) dx = 1;
    if (dx !== 0 && dy !== 0) {
      dx *= 0.707;
      dy *= 0.707;
    }
    player.x += dx * player.speed;
    player.y += dy * player.speed;
    player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

    // Угол к мыши
    player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

    // Перезарядка атаки
    if (player.attackCooldown > 0) player.attackCooldown--;
    if (player.attackCooldown === 0) {
      shoot();
      player.attackCooldown = player.attackRate;
    }

    // ---- Волны ----
    if (waveDelay > 0) {
      waveDelay--;
      if (waveDelay === 0) {
        // начать спавн
      }
    } else {
      if (enemiesSpawned < enemiesPerWave) {
        spawnTimer--;
        if (spawnTimer <= 0) {
          spawnEnemy();
          enemiesSpawned++;
          spawnTimer = spawnInterval;
        }
      } else if (enemies.length === 0) {
        // все враги убиты — следующая волна
        startWave();
      }
    }

    // ---- Враги ----
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      // движение к игроку
      const angle = Math.atan2(player.y - e.y, player.x - e.x);
      e.x += Math.cos(angle) * e.speed;
      e.y += Math.sin(angle) * e.speed;

      // столкновение с игроком
      if (dist(e.x, e.y, player.x, player.y) < e.radius + player.radius) {
        player.hp -= e.damage * 0.3;
        e.hp -= 5; // враг тоже получает урон
        if (player.hp <= 0) {
          player.hp = 0;
          gameOver = true;
        }
        // оттолкнуть врага
        const pushAngle = Math.atan2(e.y - player.y, e.x - player.x);
        e.x += Math.cos(pushAngle) * 8;
        e.y += Math.sin(pushAngle) * 8;
      }

      // смерть врага
      if (e.hp <= 0) {
        emitParticles(e.x, e.y, '#ff6633', 10);
        player.xp += e.xpReward;
        enemies.splice(i, 1);
        continue;
      }
    }

    // ---- Пули ----
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life--;

      // проверка попадания во врагов
      let bulletUsed = false;
      for (const e of enemies) {
        if (dist(b.x, b.y, e.x, e.y) < b.radius + e.radius) {
          e.hp -= b.damage;
          emitParticles(b.x, b.y, '#88ff88', 5);
          bulletUsed = true;
          break;
        }
      }

      if (bulletUsed || b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        bullets.splice(i, 1);
      }
    }

    // ---- Частицы ----
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.97;
      p.vy *= 0.97;
      p.life--;
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }

    // ---- Повышение уровня ----
    while (player.xp >= player.xpToNext) {
      player.xp -= player.xpToNext;
      player.level++;
      player.xpToNext = Math.floor(player.xpToNext * 1.4) + 4;
      player.damage += 2;
      player.maxHp += 10;
      player.hp = Math.min(player.hp + 20, player.maxHp);
      // эффект повышения уровня
      emitParticles(player.x, player.y, '#00ff88', 20);
    }

    // ---- Обновление UI ----
    xpSpan.textContent = Math.floor(player.xp);
    levelSpan.textContent = player.level;
    enemySpan.textContent = enemies.length;
  }

  // ========== ОТРИСОВКА ==========
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // ---- Сетка (стиль) ----
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // ---- Враги ----
    for (const e of enemies) {
      // тело
      const grad = ctx.createRadialGradient(e.x - 4, e.y - 4, 2, e.x, e.y, e.radius);
      grad.addColorStop(0, '#ff8844');
      grad.addColorStop(1, '#992200');
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      // здоровье
      const hpPercent = e.hp / e.maxHp;
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, e.radius * 2, 4);
      ctx.fillStyle = hpPercent > 0.5 ? '#0f0' : '#f00';
      ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, e.radius * 2 * hpPercent, 4);
      // глаза
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      for (let side = -1; side <= 1; side += 2) {
        const ex = e.x + Math.cos(ang + side * 0.4) * e.radius * 0.5;
        const ey = e.y + Math.sin(ang + side * 0.4) * e.radius * 0.5;
        ctx.beginPath();
        ctx.arc(ex, ey, e.radius * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex + Math.cos(ang) * 2, ey + Math.sin(ang) * 2, e.radius * 0.1, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
      }
    }

    // ---- Пули ----
    for (const b of bullets) {
      const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.radius);
      grad.addColorStop(0, '#aaffff');
      grad.addColorStop(1, '#00aaff');
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00aaff';
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // ---- Частицы ----
    for (const p of particles) {
      const alpha = p.life / 50;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
      ctx.fillStyle = p.color || '#ff8844';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- Игрок ----
    // тело
    const pGrad = ctx.createRadialGradient(
      player.x - 6, player.y - 6, 4,
      player.x, player.y, player.radius
    );
    pGrad.addColorStop(0, '#66ff99');
    pGrad.addColorStop(0.7, '#00aa44');
    pGrad.addColorStop(1, '#004422');
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = pGrad;
    ctx.fill();
    ctx.strokeStyle = '#88ffaa';
    ctx.lineWidth = 2;
    ctx.stroke();

    // глаза
    for (let side = -1; side <= 1; side += 2) {
      const ex = player.x + Math.cos(player.angle + side * 0.5) * player.radius * 0.5;
      const ey = player.y + Math.sin(player.angle + side * 0.5) * player.radius * 0.5;
      ctx.beginPath();
      ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + Math.cos(player.angle) * 3, ey + Math.sin(player.angle) * 3, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#222';
      ctx.fill();
    }

    // индикатор направления (ствол)
    ctx.beginPath();
    ctx.moveTo(player.x + Math.cos(player.angle) * player.radius,
      player.y + Math.sin(player.angle) * player.radius);
    ctx.lineTo(player.x + Math.cos(player.angle) * (player.radius + 14),
      player.y + Math.sin(player.angle) * (player.radius + 14));
    ctx.strokeStyle = '#88ffaa';
    ctx.lineWidth = 3;
    ctx.stroke();

    // ---- Полоса здоровья игрока ----
    const hpW = 120;
    const hpH = 10;
    const hpX = 20;
    const hpY = 50;
    ctx.fillStyle = '#333';
    ctx.fillRect(hpX, hpY, hpW, hpH);
    ctx.fillStyle = player.hp / player.maxHp > 0.4 ? '#00ff44' : '#ff3333';
    ctx.fillRect(hpX, hpY, hpW * (player.hp / player.maxHp), hpH);
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.strokeRect(hpX, hpY, hpW, hpH);
    ctx.fillStyle = '#aaa';
    ctx.font = '11px monospace';
    ctx.fillText(`HP ${Math.floor(player.hp)}/${player.maxHp}`, hpX + 4, hpY + 9);

    // ---- Уровень и XP на экране ----
    ctx.fillStyle = '#aaa';
    ctx.font = '14px monospace';
    ctx.fillText(`Уровень ${player.level}  |  XP ${Math.floor(player.xp)}/${player.xpToNext}`, 20, 30);

    // ---- Волна ----
    ctx.fillStyle = '#8888ff';
    ctx.font = '16px monospace';
    ctx.fillText(`Волна ${wave}  |  Врагов: ${enemies.length}`, W - 220, 30);

    // ---- Game Over ----
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff3344';
      ctx.font = 'bold 60px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('💀 ПОРАЖЕНИЕ', W / 2, H / 2 - 20);
      ctx.fillStyle = '#aaa';
      ctx.font = '20px monospace';
      ctx.fillText(`Вы прожили ${wave} волн и достигли ${player.level} уровня`, W / 2, H / 2 + 50);
      ctx.fillStyle = '#888';
      ctx.font = '16px monospace';
      ctx.fillText('Обновите страницу, чтобы начать заново', W / 2, H / 2 + 100);
      ctx.textAlign = 'left';
    }
  }

  // ========== ЦИКЛ ИГРЫ ==========
  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // ========== СОБЫТИЯ ==========
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key in keys) { keys[key] = true;
      e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (key in keys) { keys[key] = false;
      e.preventDefault(); }
  });
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouseX = (e.clientX - rect.left) * scaleX;
    mouseY = (e.clientY - rect.top) * scaleY;
    // ограничим, чтобы не вылетало
    mouseX = Math.max(0, Math.min(W, mouseX));
    mouseY = Math.max(0, Math.min(H, mouseY));
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ========== СТАРТ ==========
  // Первая волна
  wave = 0;
  startWave();
  // Первый спавн сразу
  spawnTimer = 10;

  gameLoop();

  console.log('🧬 Spore Survivor (упрощённая) запущена!');
  console.log('Управление: WASD — движение, мышь — прицел, автострельба.');
</script>
</body>
</html>
