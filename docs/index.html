<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Грибной Сумрак</title>
  <!-- Без этой строки браузер сам просит /favicon.ico и получает 404 в консоль -->
  <link rel="icon" href="assets/images/ui/icon_spore.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Холст и HUD лежат в одной коробке: интерфейс обязан быть привязан к
       краям игрового кадра, а не окна браузера. Иначе полоса опыта «во всю
       ширину» уезжала бы к краям экрана, а холст стоял бы посередине. -->
  <div id="stage">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <!-- Волн больше нет, и таймер — единственная мера прогресса,
           поэтому он крупный и по центру -->
      <div id="timer"><img class="icon" src="assets/images/ui/icon_time.png" alt=""><span id="timeDisplay">0:00</span></div>
      <!-- HP и споры. Обе шкалы — резной камень, проросший мицелием: снизу
           лежит «погасшая» картинка, сверху «горящая», и её открывает
           clip-path по проценту. Так заполнение — это не полоска цвета, а та
           же самая иллюстрация, которая просто зажигается слева направо.
           Шкала здоровья — тот же кадр, перекрашенный в багровый: две шкалы
           одного рисунка читаются как один прибор, а не как два разных. -->
      <div id="vitals">
        <div class="vital" id="hpVital">
          <div class="orn-bar">
            <img class="orn-empty" src="assets/images/ui/bar_hp_empty.png" alt="">
            <img class="orn-full" id="hpBar" src="assets/images/ui/bar_hp_full.png" alt="">
          </div>
        </div>
        <div class="vital" id="sporeVital">
          <div class="orn-bar">
            <img class="orn-empty" src="assets/images/ui/bar_spore_empty.png" alt="">
            <img class="orn-full" id="sporeBar" src="assets/images/ui/bar_spore_full.png" alt="">
          </div>
        </div>
      </div>
      <!-- ВЫБРОС СПОР. Единственная кнопка действия в бою: стрельба и прицел
           здесь автоматические. На клавиатуре это пробел, но на телефоне
           клавиши нет, а трата заражения — не второстепенное удобство вроде
           паузы, без неё шкала снова станет таймером до максимальной
           сложности. Кнопка гаснет, когда спор не хватает: цена механики
           должна быть видна раньше, чем её нажмут. -->
      <button id="burstBtn" class="dim" type="button" aria-label="Выброс спор">
        <img src="assets/images/ui/icon_spore.png" alt="">
        <span class="key">ПРОБЕЛ</span>
      </button>
      <!-- Опыт — тонкая полоса во всю ширину у нижнего края -->
      <div id="xpStrip">
        <span id="levelDisplay">1</span>
        <div id="xpTrack"><div id="xpBar"></div></div>
      </div>
    </div>
  </div>
  <div id="upgradeMenu" class="hidden">
    <h2>ПРОКАЧКА</h2>
    <div id="upgradeCards"></div>
  </div>
  <!-- СТАРТОВЫЙ ЭКРАН. Раньше страница открывалась сразу в бой: не было ни
       момента «я начинаю забег», ни места для названия, ни повода нажать
       что-либо самому. Заодно первое касание здесь разблокирует звук —
       браузер не даёт создать его до действия пользователя. -->
  <div id="startScreen">
    <img id="emblem" src="assets/images/ui/emblem.png" alt="">
    <h1>ГРИБНОЙ СУМРАК</h1>
    <p class="sub">Споры в воздухе. Держись, сколько сможешь.</p>
    <button id="playBtn" class="big-btn">ИГРАТЬ</button>
    <!-- Про выброс сказано прямо здесь: это единственное, что игрок делает
         руками сверх ходьбы, и догадаться о нём по гаснущей кнопке нельзя. -->
    <p class="hint">WASD или палец по экрану — движение. Стреляет само.</p>
    <p class="hint">Выброс спор — <span class="key">пробел или </span>кнопка справа: 30% заражения в удар по кругу.</p>
  </div>
  <div id="gameOverScreen" class="hidden">
    <h1>СПОРЫ ПОБЕДИЛИ</h1>
    <p>Продержался <span id="finalTime">0:00</span>, уровень <span id="finalLevel">1</span></p>
    <!-- Счётчика монет здесь больше нет: валюта убрана до магазина между
         забегами (ЭТАП 2 в ROADMAP). Цифра, которую некуда потратить,
         обещает накопление, которого не происходит. Вернётся вместе с тем,
         на что её тратить. -->
    <p><img class="icon" src="assets/images/ui/icon_kills.png" alt="Убито"> <span id="finalKills">0</span></p>
    <!-- КНОПКА, А НЕ ПОДПИСЬ. Здесь было написано «R — рестарт», и на
         телефоне это был тупик: клавиши нет, забег не перезапустить иначе
         как перезагрузкой страницы. -->
    <button id="restartBtn" class="big-btn">ЗАНОВО</button>
    <p class="hint">или клавиша R</p>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
