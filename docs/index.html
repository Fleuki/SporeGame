<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Грибной Сумрак</title>
  <!-- Без этой строки браузер сам просит /favicon.ico и получает 404 в консоль -->
  <link rel="icon" href="assets/images/ui/icon_spore.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Холст и HUD лежат в одной коробке: интерфейс обязан быть привязан к
       краям игрового кадра, а не окна браузера. Иначе полоса опыта «во всю
       ширину» уезжала бы к краям экрана, а холст стоял бы посередине. -->
  <div id="stage">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <!-- Волн больше нет, и таймер — единственная мера прогресса,
           поэтому он крупный и по центру -->
      <div id="timer"><img class="icon" src="assets/images/ui/icon_time.png" alt=""><span id="timeDisplay">0:00</span></div>
      <!-- HP и споры: компактная пара без подписей, цвет и иконка говорят
           всё сами -->
      <div id="vitals">
        <div class="vital">
          <span class="icon-slot"></span>
          <div class="bar-bg"><div class="bar-fill bar-hp" id="hpBar"></div></div>
        </div>
        <div class="vital">
          <span class="icon-slot"><img class="icon" src="assets/images/ui/icon_spore.png" alt=""></span>
          <div class="bar-bg"><div class="bar-fill bar-spore" id="sporeBar"></div></div>
        </div>
      </div>
      <!-- Опыт — тонкая полоса во всю ширину у нижнего края -->
      <div id="xpStrip">
        <span id="levelDisplay">1</span>
        <div id="xpTrack"><div id="xpBar"></div></div>
      </div>
    </div>
  </div>
  <div id="upgradeMenu" class="hidden">
    <h2>ПРОКАЧКА</h2>
    <div id="upgradeCards"></div>
  </div>
  <div id="gameOverScreen" class="hidden">
    <h1>СПОРЫ ПОБЕДИЛИ</h1>
    <p>Продержался <span id="finalTime">0:00</span>, уровень <span id="finalLevel">1</span></p>
    <p>Убито <span id="finalKills">0</span>, собрано <span id="finalCoins">0</span> 🪙</p>
    <p class="hint">R — рестарт</p>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
